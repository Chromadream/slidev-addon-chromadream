name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check if version is already published
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view slidev-addon-chromadream@$VERSION version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not found on npm — will publish."
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.skip == 'false'
        run: npm publish  # --provenance is automatic with OIDC trusted publishing
