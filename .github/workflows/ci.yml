name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
